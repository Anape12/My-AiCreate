<!DOCTYPE html>
<html>
<head>
<style>
body {
  font-family: Arial;
  background: #343541;
  color: white;
  margin: 0;
}

/* 全体 */
#container {
  display: flex;
  flex-direction: column;
  height: 100vh;
}

/* チャットエリア */
#chat {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}

/* メッセージ共通 */
.msg {
  display: flex;
  margin-bottom: 15px;
}

/* アイコン */
.icon {
  width: 40px;
  margin-right: 10px;
}

/* バブル */
.bubble {
  padding: 10px 15px;
  border-radius: 10px;
  max-width: 70%;
}

/* ユーザー */
.user .bubble {
  background: #0b93f6;
  margin-left: auto;
}

/* AI */
.assistant .bubble {
  background: #444654;
}

/* 入力エリア */
#inputArea {
  display: flex;
  padding: 10px;
  background: #40414f;
}

#q {
  flex: 1;
  padding: 10px;
  border-radius: 5px;
  border: none;
}

button {
  margin-left: 10px;
  padding: 10px 15px;
  background: #19c37d;
  border: none;
  color: white;
  border-radius: 5px;
}

.feedback {
  margin-top: 8px;
}

.feedback button {
  background: transparent;
  border: 1px solid #777;
  margin-left: 0;
  margin-right: 6px;
  padding: 4px 8px;
}
</style>
</head>

<body>
<div id="container">

  <div id="chat"></div>

  <div id="inputArea">
    <textarea id="q" placeholder="質問..." rows="2"></textarea>
    <button onclick="send()">送信</button>
  </div>

</div>

<script>
let isLoading = false;

fetch("http://localhost:8000/models/warmup", {method: "POST"}).catch(() => {});

async function send() {
  if (isLoading) return;
  isLoading = true;

  const input = document.getElementById("q");
  const query = input.value;

  if (!query) {
    isLoading = false;
    return;
  }

  input.value = "";

  addMessage("user", query);
  const msgId = addMessage("assistant", "");

  try {
    const res = await fetch("http://localhost:8000/chat-stream", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({query})
    });
    const experienceId = res.headers.get("X-Experience-ID");

    const reader = res.body.getReader();
    const decoder = new TextDecoder("utf-8");

    let result = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      result += decoder.decode(value);
      updateMessage(msgId, result);

      const chat = document.getElementById("chat");
      chat.scrollTop = chat.scrollHeight;
    }
    if (experienceId) addFeedback(msgId, experienceId);

  } catch (e) {
    updateMessage(msgId, "エラーが発生しました");
  } finally {
    isLoading = false;
  }
}

/* メッセージ生成 */
function addMessage(role, text) {
  const chat = document.getElementById("chat");

  const wrapper = document.createElement("div");
  wrapper.className = "msg " + role;

  const icon = document.createElement("div");
  icon.className = "icon";
  icon.textContent = role === "user" ? "🙋" : "🤖";

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;

  const id = Date.now() + Math.random();
  bubble.setAttribute("data-id", id);

  wrapper.appendChild(icon);
  wrapper.appendChild(bubble);

  chat.appendChild(wrapper);
  chat.scrollTop = chat.scrollHeight;

  return id;
}

/* 更新 */
function updateMessage(id, text) {
  const el = document.querySelector(`[data-id="${id}"]`);
  if (el) el.textContent = text;
}

function addFeedback(messageId, experienceId) {
  const bubble = document.querySelector(`[data-id="${messageId}"]`);
  if (!bubble) return;

  const controls = document.createElement("div");
  controls.className = "feedback";
  controls.innerHTML = '<button title="Use for learning">👍</button><button title="Do not use for learning">👎</button>';
  const [approve, reject] = controls.querySelectorAll("button");
  approve.onclick = () => reviewExperience(experienceId, "approved", 5, controls);
  reject.onclick = () => reviewExperience(experienceId, "rejected", 1, controls);
  bubble.parentElement.appendChild(controls);
}

async function reviewExperience(experienceId, status, score, controls) {
  try {
    const response = await fetch(`http://localhost:8000/experiences/${experienceId}/review`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({status, score})
    });
    if (!response.ok) throw new Error("review failed");
    controls.textContent = status === "approved" ? "Saved as a learning example." : "Excluded from learning.";
  } catch (error) {
    controls.textContent = "Could not save feedback.";
  }
}

/* Enter送信 */
document.getElementById("q").addEventListener("keydown", function(e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});
</script>
</body>
</html>
